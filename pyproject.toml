[project]
name = "sae-scope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitsandbytes>=0.49.0",
    "gradio>=6.1.0",
    "interp-embed",
    "pandas>=2.2.3",
    "plotly>=6.5.0",
    "weaviate-client>=4.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sae_scope"]

[tool.uv.sources]
interp-embed = { git = "https://github.com/nickjiang2378/interp_embed" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
